name: Glasgow comp set report

on:
  schedule:
    # Times are UTC. GMT is a fixed UTC+0 offset (it doesn't observe
    # daylight saving, unlike BST), so 08:05/14:05 GMT = 08:05/14:05 UTC
    # year-round - see README.md "Changing the schedule". Run at 5 past
    # rather than on the hour - GitHub's own docs warn that :00 is the
    # most congested slot for scheduled workflows and can be delayed or
    # dropped, which is what happened to the very first 08:00 run.
    - cron: "5 8 * * *"
    - cron: "5 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run pipeline
        env:
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          REPORT_EMAIL_APP_PASSWORD: ${{ secrets.REPORT_EMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python run_pipeline.py

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "comp-set-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.csv data/latest_comp_set.xlsx || true
          git diff --staged --quiet || git commit -m "Update comp set data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
